<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockzoeker – tests</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 12px; max-width: 800px; margin: 0 auto; }
  li { padding: 2px 0; } .ok { color: #0a7a26; } .bad { color: #c00000; font-weight: bold; }
  pre { background: #eee; padding: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Stockzoeker – tests van de zoeklogica</h1>
<p id="sum">…</p>
<ol id="list"></ol>
<script src="../zoeklogic.js"></script>
<script src="run.js"></script>
<script>
(function () {
  var res = window.ZoekTests || [], list = document.getElementById('list'), ok = 0;
  res.forEach(function (r) {
    var li = document.createElement('li');
    li.className = r.ok ? 'ok' : 'bad';
    li.textContent = (r.ok ? 'OK  ' : 'FOUT  ') + r.name;
    if (!r.ok) { var p = document.createElement('pre'); p.textContent = r.error; li.appendChild(p); }
    list.appendChild(li);
    if (r.ok) ok++;
  });
  document.getElementById('sum').textContent = ok + '/' + res.length + ' tests geslaagd';
})();
</script>
</body>
</html>
